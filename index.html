<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دفتر کلاسی اختصاصی</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#0b0b0d;color:#f7f1df}
:root{--gold:#d7a52b;--gold2:#f5d36a;--bg:#0b0b0d;--card:#151518;--muted:#b7b0a2;--line:#2b2925}
button,input,select{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.screen{min-height:100vh}
.splash{display:flex;align-items:center;justify-content:center;padding:28px;background:radial-gradient(circle at 50% 20%,#3a2a0b 0,#0b0b0d 45%,#050506 100%)}
.brand{text-align:center;width:min(460px,100%)}.brand img{width:220px;height:220px;object-fit:cover;border-radius:24px;box-shadow:0 0 45px #b77c1a66}
.brand h1{font-size:29px;margin:22px 0 8px;color:var(--gold2)}.brand p{color:#ddd1b3;line-height:1.9;margin:0 0 26px}
.gold{background:linear-gradient(135deg,#9a6b0e,#f4cf63,#a87710);color:#15120a;border:0;font-weight:bold}
.btn{width:100%;padding:14px;border-radius:14px}.outline{background:transparent;color:var(--gold2);border:1px solid #8e6a20}
.auth{max-width:460px;margin:auto;padding:28px 18px 50px}.auth img{display:block;width:125px;height:125px;margin:10px auto 20px;border-radius:20px;object-fit:cover}
.auth h2{text-align:center;color:var(--gold2);margin-bottom:4px}.auth .sub{text-align:center;color:#c9c0ad;font-size:13px;line-height:1.8;margin-bottom:20px}
label{display:block;font-size:13px;color:#d8caa8;margin:12px 0 6px}input,select{width:100%;padding:13px 14px;background:#111114;color:#fff;border:1px solid var(--line);border-radius:12px;outline:none}input:focus{border-color:var(--gold)}
.header{position:sticky;top:0;z-index:5;background:#0e0e10ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:13px 16px;display:flex;align-items:center;justify-content:space-between}
.header .title{font-weight:bold;color:var(--gold2)}.header small{display:block;color:#a9a193;margin-top:3px}
.container{max-width:1100px;margin:auto;padding:18px 15px 90px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:linear-gradient(145deg,#19191d,#101012);border:1px solid #292720;border-radius:18px;padding:16px;box-shadow:0 10px 28px #0005}.stat b{font-size:26px;color:var(--gold2)}.stat span{display:block;color:#aaa294;font-size:12px;margin-top:6px}
.section{margin-top:18px}.section h3{margin:0 0 10px;color:#f0d786}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}
.class{display:flex;align-items:center;justify-content:space-between;gap:12px}.class .icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#2a210f;color:var(--gold2);font-size:24px}
.class .meta{flex:1}.class .meta b{display:block}.class .meta small{color:#9f988c}.mini{padding:9px 12px;border-radius:10px;border:1px solid #5d481c;background:#1a160d;color:#f4d875}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 8px;border-bottom:1px solid #28262a;text-align:right}th{color:#e4ca74}
.nav{position:fixed;bottom:0;right:0;left:0;background:#101012ee;border-top:1px solid #2a2925;display:flex;justify-content:center;gap:5px;padding:8px;z-index:10}.nav button{background:none;border:0;color:#a8a095;padding:8px 11px;border-radius:12px;font-size:11px}.nav button.active{color:var(--gold2);background:#211a0b}
.toast{position:fixed;left:50%;bottom:75px;transform:translateX(-50%);background:#252015;color:#ffeaa1;border:1px solid #735817;padding:10px 15px;border-radius:12px;display:none;z-index:20}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:30}.modal .box{width:min(700px,100%);background:#151518;border:1px solid #3b311d;border-radius:22px 22px 0 0;padding:20px;max-height:88vh;overflow:auto}
.empty{text-align:center;color:#8f8a80;padding:25px}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.header{padding:12px}.container{padding-bottom:95px}.brand img{width:190px;height:190px}}

.install-btn{display:none;position:fixed;top:12px;left:12px;z-index:50;background:linear-gradient(135deg,#9a6b0e,#f4cf63,#a87710);color:#15120a;border:0;border-radius:12px;padding:9px 13px;font-weight:bold;box-shadow:0 5px 18px #0007}
.install-btn.show{display:block}.install-banner{position:fixed;left:12px;right:12px;bottom:82px;z-index:40;background:#171719;border:1px solid #725719;border-radius:16px;padding:14px;box-shadow:0 12px 35px #0009;display:none}.install-banner.show{display:block}.install-banner b{color:#f5d36a}.install-banner p{margin:7px 0;color:#c8c0b0;font-size:12px;line-height:1.8}.install-banner .x{float:left;background:none;border:0;color:#aaa;font-size:20px}

</style>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0b0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

</head>
<body>

<button id="installBtn" class="install-btn" onclick="installApp()">📲 نصب برنامه</button>
<div id="installBanner" class="install-banner">
  <button class="x" onclick="closeInstall()">×</button>
  <b>دفتر کلاسی اختصاصی را روی گوشی نصب کنید</b>
  <p id="installText">با نصب برنامه، آیکن آن روی صفحه گوشی قرار می‌گیرد و می‌توانید مانند یک اپلیکیشن از آن استفاده کنید.</p>
  <button class="btn gold" onclick="installApp()">📲 نصب دفتر کلاسی</button>
</div>

<div id="app"></div>
<div id="toast" class="toast"></div>
<script>
const LOGO='logo.jpg';
const KEY='dke_public_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{users:[],current:null};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function user(){return db.users.find(x=>x.id===db.current)}
function render(){
 if(!db.current){login();return}
 const u=user(); if(!u){db.current=null;save();login();return}
 dashboard();
}
function login(){
 app.innerHTML=`<div class="screen auth">
  <img src="${LOGO}">
  <h2>دفتر کلاسی اختصاصی</h2>
  <div class="sub">روابط عمومی مدیریت آموزش و پرورش شهرستان اردل<br>سامانه اختصاصی مدیریت کلاس برای معلمان</div>
  <label>نام کاربری / شماره همراه</label><input id="liuser" placeholder="نام کاربری">
  <label>رمز عبور</label><input id="lipass" type="password" placeholder="رمز عبور">
  <button class="btn gold" onclick="doLogin()">ورود به پنل معلم</button>
  <button class="btn outline" style="margin-top:10px" onclick="register()">ایجاد حساب معلم</button>
  <p style="text-align:center;color:#7f7a72;font-size:11px;margin-top:25px">نسخه عمومی قابل استفاده برای چندین معلم — اطلاعات هر حساب جداگانه نگهداری می‌شود.</p>
 </div>`;
}
function doLogin(){
 let a=document.getElementById('liuser').value.trim(),p=document.getElementById('lipass').value;
 let u=db.users.find(x=>x.username===a&&x.password===p);
 if(!u){toast('نام کاربری یا رمز عبور صحیح نیست');return}
 db.current=u.id;save();render();
}
function register(){
 app.innerHTML=`<div class="screen auth"><img src="${LOGO}"><h2>ثبت‌نام معلم</h2><div class="sub">حساب اختصاصی خود را بسازید</div>
 <label>نام و نام خانوادگی</label><input id="rn" placeholder="مثلاً علی رضایی">
 <label>نام کاربری</label><input id="ru" placeholder="یک نام کاربری انتخاب کنید">
 <label>رمز عبور</label><input id="rp" type="password">
 <label>مدرسه / محل خدمت (اختیاری)</label><input id="rs" placeholder="نام مدرسه">
 <button class="btn gold" onclick="doRegister()">ساخت حساب</button>
 <button class="btn outline" style="margin-top:10px" onclick="login()">بازگشت به ورود</button></div>`;
}
function doRegister(){
 let name=rn.value.trim(),un=ru.value.trim(),pw=rp.value,school=rs.value.trim();
 if(!name||!un||!pw){toast('اطلاعات ضروری را کامل کنید');return}
 if(db.users.some(x=>x.username===un)){toast('این نام کاربری قبلاً ثبت شده است');return}
 let u={id:Date.now().toString(),name,username:un,password:pw,school,classes:[]};
 db.users.push(u);db.current=u.id;save();toast('حساب با موفقیت ساخته شد');render();
}
function dashboard(){
 let u=user(), students=u.classes.reduce((n,c)=>n+c.students.length,0);
 app.innerHTML=`<div class="header"><div><div class="title">دفتر کلاسی اختصاصی</div><small>${esc(u.name)}${u.school?' • '+esc(u.school):''}</small></div><button class="mini" onclick="profile()">پروفایل</button></div>
 <main class="container">
 <div class="grid">
  <div class="card stat"><b>${u.classes.length}</b><span>کلاس‌های من</span></div>
  <div class="card stat"><b>${students}</b><span>دانش‌آموزان</span></div>
  <div class="card stat"><b>${u.classes.filter(c=>c.active).length}</b><span>کلاس فعال</span></div>
  <div class="card stat"><b>✓</b><span>ذخیره‌سازی محلی</span></div>
 </div>
 <div class="section"><div class="row"><button class="btn gold" onclick="newClass()">＋ ایجاد کلاس جدید</button><button class="btn outline" onclick="backup()">پشتیبان‌گیری</button></div></div>
 <div class="section"><h3>کلاس‌های من</h3><div id="classes">${u.classes.length?u.classes.map(c=>`<div class="card class" style="margin:9px 0"><div class="icon">📚</div><div class="meta"><b>${esc(c.name)}</b><small>${esc(c.grade||'')} • ${c.students.length} دانش‌آموز</small></div><button class="mini" onclick="openClass('${c.id}')">ورود</button></div>`).join(''):'<div class="card empty">هنوز کلاسی ایجاد نکرده‌اید.</div>'}</div></div>
 <div class="section"><div class="card"><h3 style="margin-top:0">امکانات دفتر کلاسی</h3><p style="color:#bdb5a6;line-height:2;font-size:13px">حضور و غیاب، ثبت نمرات، پرونده دانش‌آموز، کارنامه، تکالیف، گزارش و پشتیبان‌گیری در پنل اختصاصی هر معلم.</p></div></div>
 </main><nav class="nav"><button class="active">⌂<br>خانه</button><button onclick="newClass()">＋<br>کلاس جدید</button><button onclick="backup()">⇩<br>پشتیبان</button><button onclick="logout()">↪<br>خروج</button></nav>`;
}
function newClass(){
 let name=prompt('نام کلاس را وارد کنید:');if(!name)return;
 let grade=prompt('پایه / مقطع:','چهارم');let u=user();
 u.classes.push({id:Date.now().toString(),name,grade,active:true,students:[]});save();render();toast('کلاس ایجاد شد');
}
function openClass(id){
 let u=user(),c=u.classes.find(x=>x.id===id);if(!c)return;
 app.innerHTML=`<div class="header"><div><div class="title">${esc(c.name)}</div><small>${esc(c.grade||'')}</small></div><button class="mini" onclick="dashboard()">بازگشت</button></div>
 <main class="container"><div class="row"><button class="btn gold" onclick="addStudent('${id}')">＋ افزودن دانش‌آموز</button><button class="btn outline" onclick="classReport('${id}')">📊 گزارش کلاس</button></div>
 <div class="section"><h3>دانش‌آموزان (${c.students.length})</h3>${c.students.length?`<div class="card"><table><thead><tr><th>نام</th><th>کد</th><th>حضور</th><th>میانگین</th><th></th></tr></thead><tbody>${c.students.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.code)}</td><td>${s.present||0}</td><td>${avg(s).toFixed(2)}</td><td><button class="mini" onclick="student('${id}','${s.id}')">پرونده</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="card empty">هنوز دانش‌آموزی ثبت نشده است.</div>'}</div></main>
 <nav class="nav"><button onclick="dashboard()">⌂<br>خانه</button><button class="active" onclick="addStudent('${id}')">＋<br>دانش‌آموز</button><button onclick="classReport('${id}')">▥<br>گزارش</button></nav>`;
}
function addStudent(cid){
 let u=user(),c=u.classes.find(x=>x.id===cid);
 let name=prompt('نام و نام خانوادگی دانش‌آموز:');if(!name)return;
 let code=prompt('کد دانش‌آموزی (اختیاری):','');
 c.students.push({id:Date.now().toString(),name,code,grades:{},present:0,absent:0,note:''});save();openClass(cid);toast('دانش‌آموز اضافه شد');
}
function avg(s){let v=Object.values(s.grades||{}).map(Number).filter(x=>!isNaN(x));return v.length?v.reduce((a,b)=>a+b,0)/v.length:0}
function student(cid,sid){
 let c=user().classes.find(x=>x.id===cid),s=c.students.find(x=>x.id===sid);
 app.innerHTML=`<div class="header"><div><div class="title">پرونده دانش‌آموز</div><small>${esc(s.name)}</small></div><button class="mini" onclick="openClass('${cid}')">بازگشت</button></div>
 <main class="container"><div class="card"><h3>${esc(s.name)}</h3><p style="color:#aaa">کد: ${esc(s.code||'ثبت نشده')}</p>
 <label>حضور</label><input id="pr" type="number" value="${s.present||0}">
 <label>غیبت</label><input id="ab" type="number" value="${s.absent||0}">
 <label>ریاضی</label><input id="g1" type="number" min="0" max="20" value="${s.grades['ریاضی']??''}">
 <label>علوم</label><input id="g2" type="number" min="0" max="20" value="${s.grades['علوم']??''}">
 <label>فارسی</label><input id="g3" type="number" min="0" max="20" value="${s.grades['فارسی']??''}">
 <label>یادداشت</label><input id="note" value="${esc(s.note)}">
 <button class="btn gold" style="margin-top:15px" onclick="saveStudent('${cid}','${sid}')">ذخیره پرونده</button></div>
 <div class="section card"><h3>کارنامه</h3><p>میانگین: <b style="color:#f4d875">${avg(s).toFixed(2)}</b></p></div></main>`;
}
function saveStudent(cid,sid){
 let s=user().classes.find(x=>x.id===cid).students.find(x=>x.id===sid);
 s.present=Number(pr.value)||0;s.absent=Number(ab.value)||0;s.grades['ریاضی']=Number(g1.value)||0;s.grades['علوم']=Number(g2.value)||0;s.grades['فارسی']=Number(g3.value)||0;s.note=note.value;save();student(cid,sid);toast('پرونده ذخیره شد');
}
function classReport(cid){
 let c=user().classes.find(x=>x.id===cid);let rows=c.students.map(s=>`<tr><td>${esc(s.name)}</td><td>${avg(s).toFixed(2)}</td><td>${s.present||0}</td><td>${s.absent||0}</td></tr>`).join('');
 app.innerHTML=`<div class="header"><div><div class="title">گزارش کلاس</div><small>${esc(c.name)}</small></div><button class="mini" onclick="openClass('${cid}')">بازگشت</button></div><main class="container"><div class="card"><table><thead><tr><th>دانش‌آموز</th><th>میانگین</th><th>حضور</th><th>غیبت</th></tr></thead><tbody>${rows||'<tr><td colspan="4">داده‌ای وجود ندارد</td></tr>'}</tbody></table></div></main>`;
}
function profile(){
 let u=user();app.innerHTML=`<div class="header"><div class="title">پروفایل معلم</div><button class="mini" onclick="dashboard()">بازگشت</button></div><main class="container"><div class="card"><label>نام</label><input id="pn" value="${esc(u.name)}"><label>مدرسه</label><input id="ps" value="${esc(u.school)}"><button class="btn gold" style="margin-top:15px" onclick="uSave()">ذخیره</button></div><div class="section card"><p style="color:#aaa;font-size:13px">نام کاربری: ${esc(u.username)}</p><button class="btn outline" onclick="backup()">پشتیبان‌گیری از اطلاعات</button><button class="btn outline" style="margin-top:10px" onclick="logout()">خروج از حساب</button></div></main>`;
}
function uSave(){let u=user();u.name=pn.value.trim()||u.name;u.school=ps.value.trim();save();dashboard();toast('پروفایل ذخیره شد')}
function backup(){let blob=new Blob([JSON.stringify(user(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup_daftar_kelasi.json';a.click();toast('فایل پشتیبان آماده شد')}
function logout(){db.current=null;save();login()}
render();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>

<script>
let deferredInstallPrompt=null;
const installBtn=document.getElementById('installBtn');
const installBanner=document.getElementById('installBanner');

window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  installBtn.classList.add('show');
  installBanner.classList.add('show');
});

window.addEventListener('appinstalled',()=>{
  deferredInstallPrompt=null;
  installBtn.classList.remove('show');
  installBanner.classList.remove('show');
  if(typeof toast==='function') toast('برنامه با موفقیت روی گوشی نصب شد');
});

function installApp(){
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.then(()=>{deferredInstallPrompt=null;});
    return;
  }
  // Android Chrome may expose installation through the browser menu.
  if(/Android/i.test(navigator.userAgent)){
    installBanner.classList.add('show');
    document.getElementById('installText').textContent='اگر دکمه نصب ظاهر نشد، از منوی سه‌نقطه Chrome گزینه «Install app» یا «افزودن به صفحه اصلی» را انتخاب کنید.';
  }else if(/iPhone|iPad|iPod/i.test(navigator.userAgent)){
    installBanner.classList.add('show');
    document.getElementById('installText').textContent='در آیفون: دکمه Share را بزنید و سپس «Add to Home Screen» را انتخاب کنید.';
  }
}
function closeInstall(){installBanner.classList.remove('show');}
</script>

</body>
</html>
