<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0d"><link rel="manifest" href="manifest.webmanifest"><title>دفتر کلاسی اختصاصی</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#0b0b0d;color:#f7f1df}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}:root{--gold:#f2ca57;--bg:#0b0b0d;--card:#151518;--line:#302d27;--muted:#aaa295}.header{position:sticky;top:0;z-index:10;background:#0e0e10ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 15px;display:flex;align-items:center;justify-content:space-between}.title{font-weight:bold;color:var(--gold)}.header small{display:block;color:#aaa;margin-top:3px}.container{max-width:1100px;margin:auto;padding:16px 14px 95px}.card{background:linear-gradient(145deg,#19191d,#101012);border:1px solid #292720;border-radius:17px;padding:15px;box-shadow:0 8px 25px #0005}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat b{font-size:25px;color:var(--gold)}.stat span{display:block;color:var(--muted);font-size:12px;margin-top:5px}.row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1;min-width:145px}.section{margin-top:15px}.section h3{margin:0 0 10px;color:#f0d786}.btn{width:100%;padding:12px;border-radius:12px;border:1px solid #5e491d;background:transparent;color:var(--gold)}.gold{background:linear-gradient(135deg,#9a6b0e,#f4cf63,#a87710);color:#15120a;border:0;font-weight:bold}input,select,textarea{width:100%;padding:11px 12px;background:#111114;color:#fff;border:1px solid var(--line);border-radius:11px;outline:0}textarea{min-height:75px;resize:vertical}label{display:block;font-size:12px;color:#d8caa8;margin:10px 0 5px}.auth{max-width:480px;margin:auto;padding:30px 18px}.auth img{display:block;width:140px;height:140px;object-fit:cover;border-radius:20px;margin:5px auto 18px}.auth h2{text-align:center;color:var(--gold)}.sub{text-align:center;color:#c5bcac;font-size:13px;line-height:1.9;margin-bottom:18px}.nav{position:fixed;bottom:0;right:0;left:0;background:#101012ee;border-top:1px solid #2a2925;display:flex;justify-content:center;gap:4px;padding:7px;z-index:20}.nav button{background:none;border:0;color:#aaa095;padding:7px 10px;border-radius:11px;font-size:11px}.nav button.active{color:var(--gold);background:#211a0b}.toast{position:fixed;left:50%;bottom:75px;transform:translateX(-50%);background:#252015;color:#ffeaa1;border:1px solid #735817;padding:10px 15px;border-radius:12px;display:none;z-index:50}.mini{padding:8px 10px;border-radius:9px;border:1px solid #604b1e;background:#1a160d;color:#f4d875}.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.tabs button{white-space:nowrap;background:#171719;border:1px solid #302c25;color:#aaa;padding:9px 12px;border-radius:10px}.tabs button.active{background:#2b210c;color:var(--gold);border-color:#765a1b}.student-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin:8px 0}.status{display:flex;gap:5px;flex-wrap:wrap}.status button{padding:7px 8px;border-radius:9px;border:1px solid #38342d;background:#121215;color:#aaa;font-size:11px}.status button.on.present{background:#12361f;color:#6ee69a;border-color:#246c3b}.status button.on.absent{background:#3a1616;color:#ff8585;border-color:#743131}.status button.on.late{background:#3a2b0d;color:#ffd66b;border-color:#775a19}.status button.on.excused{background:#182c3b;color:#79c9ff;border-color:#2d6288}.eval{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.eval button{padding:9px 5px;border-radius:9px;border:1px solid #37332b;background:#121215;color:#aaa;font-size:11px}.eval button.on.vgood{background:#12361f;color:#6ee69a;border-color:#246c3b}.eval button.on.good{background:#162d3b;color:#79c9ff;border-color:#2d6288}.eval button.on.ok{background:#3a2b0d;color:#ffd66b;border-color:#775a19}.eval button.on.more{background:#3a1616;color:#ff8585;border-color:#743131}.badge{display:inline-block;padding:4px 7px;border-radius:8px;background:#211a0b;color:var(--gold);font-size:10px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px 7px;border-bottom:1px solid #29272b;text-align:right;white-space:nowrap}th{color:#e4ca74}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;z-index:40}.modal .box{width:min(700px,100%);max-height:90vh;overflow:auto;background:#151518;border:1px solid #3b311d;border-radius:20px 20px 0 0;padding:18px}.empty{text-align:center;color:#8f8a80;padding:25px}.hint{color:#aaa;font-size:11px;line-height:1.8}.danger{color:#ff8b8b!important;border-color:#713333!important}.install-btn{display:none;position:fixed;top:10px;left:10px;z-index:30;background:#f1c854;color:#15120a;border:0;border-radius:11px;padding:8px 11px;font-weight:bold}.install-btn.show{display:block}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.eval{grid-template-columns:repeat(2,1fr)}.student-row{grid-template-columns:1fr}.header{padding:11px}.container{padding-bottom:100px}}
</style></head><body>
<button id="installBtn" class="install-btn" onclick="installApp()">📲 نصب برنامه</button><div id="app"></div><div id="toast" class="toast"></div>
<script>
const KEY='dke_v2';let db=JSON.parse(localStorage.getItem(KEY)||'null')||{users:[],current:null};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',2200)}function user(){return db.users.find(x=>x.id===db.current)}function currentClass(id){return user()?.classes.find(c=>c.id===id)}
function render(){if(!db.current)return login();if(!user()){db.current=null;save();return login()}dashboard()}
function login(){app.innerHTML=`<div class="auth"><img src="logo.jpg"><h2>دفتر کلاسی اختصاصی</h2><div class="sub">سامانه مدیریت کلاس، حضور و غیاب و ارزشیابی توصیفی</div><label>نام کاربری</label><input id="lu"><label>رمز عبور</label><input id="lp" type="password"><button class="btn gold" style="margin-top:14px" onclick="doLogin()">ورود به پنل معلم</button><button class="btn" style="margin-top:9px" onclick="register()">ایجاد حساب معلم</button></div>`}
function doLogin(){let u=db.users.find(x=>x.username===lu.value.trim()&&x.password===lp.value);if(!u)return toast('نام کاربری یا رمز عبور صحیح نیست');db.current=u.id;save();dashboard()}
function register(){app.innerHTML=`<div class="auth"><img src="logo.jpg"><h2>ثبت‌نام معلم</h2><label>نام و نام خانوادگی</label><input id="rn"><label>نام کاربری</label><input id="ru"><label>رمز عبور</label><input id="rp" type="password"><label>مدرسه</label><input id="rs"><button class="btn gold" style="margin-top:14px" onclick="doRegister()">ساخت حساب</button><button class="btn" style="margin-top:9px" onclick="login()">بازگشت</button></div>`}
function doRegister(){let name=rn.value.trim(),un=ru.value.trim(),pw=rp.value;if(!name||!un||!pw)return toast('اطلاعات ضروری را کامل کنید');if(db.users.some(x=>x.username===un))return toast('این نام کاربری قبلاً ثبت شده است');let u={id:Date.now().toString(),name,username:un,password:pw,school:rs.value.trim(),classes:[]};db.users.push(u);db.current=u.id;save();dashboard()}
function dashboard(){let u=user(),cls=u.classes,st=cls.reduce((n,c)=>n+c.students.length,0),sessions=cls.reduce((n,c)=>n+c.sessions.length,0);app.innerHTML=`<div class="header"><div><div class="title">دفتر کلاسی</div><small>${esc(u.name)}${u.school?' • '+esc(u.school):''}</small></div><button class="mini" onclick="profile()">پروفایل</button></div><main class="container"><div class="grid"><div class="card stat"><b>${cls.length}</b><span>کلاس</span></div><div class="card stat"><b>${st}</b><span>دانش‌آموز</span></div><div class="card stat"><b>${sessions}</b><span>جلسه ثبت‌شده</span></div><div class="card stat"><b>✓</b><span>ذخیره روی گوشی</span></div></div><div class="section row"><button class="btn gold" onclick="newClass()">＋ ایجاد کلاس</button><button class="btn" onclick="backup()">💾 پشتیبان‌گیری</button></div><div class="section"><h3>کلاس‌های من</h3>${cls.length?cls.map(c=>`<div class="card" style="margin:8px 0;display:flex;align-items:center;gap:10px"><div style="font-size:25px">📚</div><div style="flex:1"><b>${esc(c.name)}</b><div class="hint">${esc(c.grade||'')} • ${c.students.length} دانش‌آموز • ${c.sessions.length} جلسه</div></div><button class="mini" onclick="openClass('${c.id}')">ورود</button></div>`).join(''):'<div class="card empty">هنوز کلاسی ساخته نشده است.</div>'}</div></main><nav class="nav"><button class="active">⌂<br>خانه</button><button onclick="newClass()">＋<br>کلاس</button><button onclick="backup()">⇩<br>پشتیبان</button><button onclick="logout()">↪<br>خروج</button></nav>`}
function newClass(){let name=prompt('نام کلاس:');if(!name)return;let grade=prompt('پایه / مقطع:','چهارم');user().classes.push({id:Date.now().toString(),name,grade,students:[],sessions:[]});save();dashboard();toast('کلاس ساخته شد')}
function openClass(id){let c=currentClass(id);app.innerHTML=`<div class="header"><div><div class="title">${esc(c.name)}</div><small>${esc(c.grade||'')}</small></div><button class="mini" onclick="dashboard()">بازگشت</button></div><main class="container"><div class="row"><button class="btn gold" onclick="addStudent('${id}')">＋ دانش‌آموز</button><button class="btn" onclick="newSession('${id}')">＋ جلسه جدید</button><button class="btn" onclick="classReport('${id}')">📊 گزارش کلاس</button></div><div class="section"><div class="card"><h3 style="margin-top:0">دانش‌آموزان (${c.students.length})</h3>${c.students.length?`<div class="table-wrap"><table><thead><tr><th>نام</th><th>جلسات</th><th>حضور</th><th>ارزشیابی</th><th></th></tr></thead><tbody>${c.students.map(s=>{let a=attendanceStats(c,s.id),e=evalStats(c,s.id);return `<tr><td>${esc(s.name)}</td><td>${c.sessions.length}</td><td>${a.p}</td><td>${e.text}</td><td><button class="mini" onclick="studentReport('${id}','${s.id}')">پرونده</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">دانش‌آموزی ثبت نشده است.</div>'}</div></div><div class="section"><h3>جلسات ثبت‌شده</h3>${c.sessions.length?[...c.sessions].reverse().map(s=>`<div class="card" style="margin:8px 0;display:flex;align-items:center;gap:10px"><div class="badge">جلسه ${s.no}</div><div style="flex:1"><b>${esc(s.date)}</b><div class="hint">${esc(s.title||'بدون عنوان')}</div></div><button class="mini" onclick="session('${id}','${s.id}')">ورود</button></div>`).join(''):'<div class="card empty">برای شروع، «جلسه جدید» را بزنید.</div>'}</div></main><nav class="nav"><button onclick="dashboard()">⌂<br>خانه</button><button class="active" onclick="newSession('${id}')">＋<br>جلسه</button><button onclick="classReport('${id}')">▥<br>گزارش</button></nav>`}
function addStudent(cid){let c=currentClass(cid),name=prompt('نام و نام خانوادگی دانش‌آموز:');if(!name)return;let code=prompt('کد دانش‌آموزی (اختیاری):','');c.students.push({id:Date.now().toString(),name:name.trim(),code:code||'',notes:''});save();openClass(cid);toast('دانش‌آموز اضافه شد')}
function newSession(cid){let c=currentClass(cid),date=new Date().toLocaleDateString('fa-IR'),title=prompt('موضوع یا عنوان جلسه (اختیاری):','');let s={id:Date.now().toString(),no:c.sessions.length+1,date,title:title||'',attendance:{},evaluation:{},notes:{}};c.students.forEach(x=>{s.attendance[x.id]='present';s.evaluation[x.id]='good';s.notes[x.id]=''});c.sessions.push(s);save();session(cid,s.id)}
const attNames={present:'حاضر',absent:'غایب',late:'تأخیر',excused:'غیبت موجه'},evalNames={vgood:'خیلی خوب',good:'خوب',ok:'قابل قبول',more:'نیاز به تلاش بیشتر'};
function session(cid,sid){let c=currentClass(cid),s=c.sessions.find(x=>x.id===sid);app.innerHTML=`<div class="header"><div><div class="title">جلسه ${s.no}</div><small>${esc(s.date)}${s.title?' • '+esc(s.title):''}</small></div><button class="mini" onclick="openClass('${cid}')">بازگشت</button></div><main class="container"><div class="card"><div class="row"><div><label>تاریخ جلسه</label><input id="sd" value="${esc(s.date)}"></div><div><label>عنوان جلسه</label><input id="st" value="${esc(s.title)}"></div></div><button class="btn gold" style="margin-top:10px" onclick="saveSessionMeta('${cid}','${sid}')">ذخیره مشخصات جلسه</button></div><div class="section"><h3>حضور و غیاب + ارزشیابی توصیفی</h3>${c.students.length?c.students.map(x=>`<div class="card" style="margin:10px 0"><div class="student-row"><div><b>${esc(x.name)}</b><div class="hint">${esc(x.code||'بدون کد')}</div></div><button class="mini" onclick="studentReport('${cid}','${x.id}')">پرونده</button></div><div class="hint">حضور و غیاب</div><div class="status">${Object.entries(attNames).map(([k,v])=>`<button class="${s.attendance[x.id]===k?'on '+k:''}" onclick="setAtt('${cid}','${sid}','${x.id}','${k}')">${v}</button>`).join('')}</div><div class="hint" style="margin-top:10px">ارزشیابی توصیفی</div><div class="eval">${Object.entries(evalNames).map(([k,v])=>`<button class="${s.evaluation[x.id]===k?'on '+k:''}" onclick="setEval('${cid}','${sid}','${x.id}','${k}')">${v}</button>`).join('')}</div><label>توضیح کوتاه معلم</label><textarea onchange="setNote('${cid}','${sid}','${x.id}',this.value)" placeholder="مثلاً: در فعالیت کلاسی مشارکت خوبی داشت...">${esc(s.notes[x.id]||'')}</textarea></div>`).join(''):'<div class="card empty">ابتدا دانش‌آموز اضافه کنید.</div>'}</div></main>`}
function setAtt(cid,sid,uid,k){let s=currentClass(cid).sessions.find(x=>x.id===sid);s.attendance[uid]=k;save();session(cid,sid)}function setEval(cid,sid,uid,k){let s=currentClass(cid).sessions.find(x=>x.id===sid);s.evaluation[uid]=k;save();session(cid,sid)}function setNote(cid,sid,uid,v){let s=currentClass(cid).sessions.find(x=>x.id===sid);s.notes[uid]=v;save()}
function saveSessionMeta(cid,sid){let s=currentClass(cid).sessions.find(x=>x.id===sid);s.date=sd.value;s.title=st.value;save();session(cid,sid);toast('مشخصات جلسه ذخیره شد')}
function attendanceStats(c,uid){let a={p:0,ab:0,l:0,e:0};c.sessions.forEach(s=>{let k=s.attendance[uid];if(k==='present')a.p++;if(k==='absent')a.ab++;if(k==='late')a.l++;if(k==='excused')a.e++});return a}
function evalStats(c,uid){let z={vgood:0,good:0,ok:0,more:0};c.sessions.forEach(s=>{let k=s.evaluation[uid];if(z[k]!=null)z[k]++});let entries=Object.entries(z).filter(x=>x[1]);let text=entries.map(x=>`${evalNames[x[0]]}: ${x[1]}`).join('، ')||'—';return {z,text}}
function studentReport(cid,uid){let c=currentClass(cid),s=c.students.find(x=>x.id===uid),a=attendanceStats(c,uid),e=evalStats(c,uid);app.innerHTML=`<div class="header"><div><div class="title">پرونده دانش‌آموز</div><small>${esc(s.name)}</small></div><button class="mini" onclick="openClass('${cid}')">بازگشت</button></div><main class="container"><div class="grid"><div class="card stat"><b>${a.p}</b><span>حاضر</span></div><div class="card stat"><b>${a.ab}</b><span>غایب</span></div><div class="card stat"><b>${a.l}</b><span>تأخیر</span></div><div class="card stat"><b>${c.sessions.length}</b><span>کل جلسات</span></div></div><div class="section card"><h3>خلاصه ارزشیابی</h3><p style="line-height:2;color:#ccc">${esc(e.text)}</p></div><div class="section"><h3>سابقه جلسه‌به‌جلسه</h3>${c.sessions.map(x=>`<div class="card" style="margin:8px 0"><div style="display:flex;justify-content:space-between;gap:8px"><b>جلسه ${x.no}</b><span class="hint">${esc(x.date)}</span></div><p>حضور: <span class="badge">${attNames[x.attendance[uid]]||'—'}</span> &nbsp; ارزشیابی: <span class="badge">${evalNames[x.evaluation[uid]]||'—'}</span></p>${x.notes[uid]?`<div class="hint">یادداشت: ${esc(x.notes[uid])}</div>`:''}</div>`).join('')||'<div class="card empty">هنوز جلسه‌ای ثبت نشده است.</div>'}</div></main>`}
function classReport(cid){let c=currentClass(cid);let rows=c.students.map(s=>{let a=attendanceStats(c,s.id),e=evalStats(c,s.id);return `<tr><td>${esc(s.name)}</td><td>${a.p}</td><td>${a.ab}</td><td>${a.l}</td><td>${a.e}</td><td>${esc(e.text)}</td></tr>`}).join('');app.innerHTML=`<div class="header"><div><div class="title">گزارش کلاس</div><small>${esc(c.name)} • ${c.sessions.length} جلسه</small></div><button class="mini" onclick="openClass('${cid}')">بازگشت</button></div><main class="container"><div class="card"><div class="table-wrap"><table><thead><tr><th>دانش‌آموز</th><th>حاضر</th><th>غایب</th><th>تأخیر</th><th>موجه</th><th>ارزشیابی</th></tr></thead><tbody>${rows||'<tr><td colspan="6">داده‌ای وجود ندارد</td></tr>'}</tbody></table></div></div><div class="section card"><h3>راهنمای ارزشیابی</h3><p class="hint">خیلی خوب، خوب، قابل قبول، نیاز به تلاش بیشتر. این گزارش بر اساس جلسات ثبت‌شده همین کلاس محاسبه شده است.</p></div></main>`}
function profile(){let u=user();app.innerHTML=`<div class="header"><div class="title">پروفایل</div><button class="mini" onclick="dashboard()">بازگشت</button></div><main class="container"><div class="card"><label>نام</label><input id="pn" value="${esc(u.name)}"><label>مدرسه</label><input id="ps" value="${esc(u.school)}"><button class="btn gold" style="margin-top:12px" onclick="saveProfile()">ذخیره</button></div><div class="section card"><button class="btn" onclick="backup()">💾 خروجی پشتیبان JSON</button><button class="btn" style="margin-top:9px" onclick="document.getElementById('imp').click()">↥ بازیابی پشتیبان</button><input id="imp" type="file" accept="application/json" hidden onchange="restore(event)"><button class="btn danger" style="margin-top:9px" onclick="logout()">خروج از حساب</button></div></main>`}
function saveProfile(){let u=user();u.name=pn.value.trim()||u.name;u.school=ps.value.trim();save();dashboard();toast('پروفایل ذخیره شد')}
function backup(){let blob=new Blob([JSON.stringify(user(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='دفتر-کلاسی-پشتیبان.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('فایل پشتیبان آماده شد')}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.classes)throw 0;user().classes=x.classes;save();dashboard();toast('پشتیبان بازیابی شد')}catch{toast('فایل پشتیبان معتبر نیست')}};r.readAsText(f)}
function logout(){db.current=null;save();login()}
render();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
let deferred=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;document.getElementById('installBtn').classList.add('show')});function installApp(){if(deferred){deferred.prompt();deferred=null}else toast('از منوی سه‌نقطه مرورگر گزینه «نصب برنامه» را انتخاب کنید.')}
</script></body></html>
